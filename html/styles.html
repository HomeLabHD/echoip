<style>
  /* Reset */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Theme — Light */
  :root {
    --bg: {{ .Brand.Color "bg" "#f3f8ee" }};
    --bg-surface: {{ .Brand.Color "bg-surface" "#e8f2e0" }};
    --border: {{ .Brand.Color "border" "#cde3c0" }};
    --text: {{ .Brand.Color "text" "#1e3416" }};
    --text-secondary: {{ .Brand.Color "text-secondary" "#52774a" }};
    --accent: {{ .Brand.Color "accent" "#2d8b21" }};
    --code-bg: {{ .Brand.Color "code-bg" "#e8f2e0" }};
    --ip-color: {{ .Brand.Color "ip-color" "#236a17" }};
    --hero-bg: {{ .Brand.Color "hero-bg" "#edf6e6" }};
    --code-accent: {{ .Brand.Color "code-accent" "#2d8b21" }};
    --json-bg: {{ .Brand.Color "json-bg" "#1b2d15" }};
    --json-text: {{ .Brand.Color "json-text" "#e2f3d9" }};
    --json-border: {{ .Brand.Color "json-border" "#56b03c" }};
    --table-row-hover: {{ .Brand.Color "table-row-hover" "#edf6e6" }};
    --top-bar: {{ .Brand.Color "top-bar" "#42bc2c" }};
  }

  /* Theme — Dark */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: {{ .Brand.Color "bg-dark" "#121a0f" }};
      --bg-surface: {{ .Brand.Color "bg-surface-dark" "#1a2515" }};
      --border: {{ .Brand.Color "border-dark" "#334529" }};
      --text: {{ .Brand.Color "text-dark" "#e6f3de" }};
      --text-secondary: {{ .Brand.Color "text-secondary-dark" "#9cbf8d" }};
      --accent: {{ .Brand.Color "accent-dark" "#63cf45" }};
      --code-bg: {{ .Brand.Color "code-bg-dark" "#1a2515" }};
      --ip-color: {{ .Brand.Color "ip-color-dark" "#86ec6e" }};
      --hero-bg: {{ .Brand.Color "hero-bg-dark" "#121a0f" }};
      --code-accent: {{ .Brand.Color "code-accent-dark" "#63cf45" }};
      --json-bg: {{ .Brand.Color "json-bg-dark" "#0d1409" }};
      --json-text: {{ .Brand.Color "json-text-dark" "#d6ecc9" }};
      --json-border: {{ .Brand.Color "json-border-dark" "#63cf45" }};
      --table-row-hover: {{ .Brand.Color "table-row-hover-dark" "#1a2515" }};
      --top-bar: {{ .Brand.Color "top-bar-dark" "#63cf45" }};
    }
  }

  /* Base */
  html {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  code {
    font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.95em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }

  pre code {
    background: none;
    padding: 0;
  }

  /* Layout */
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .section {
    padding: 2.5rem 0;
    border-bottom: 1px solid var(--border);
  }

  .section:last-child {
    border-bottom: none;
  }

  h2 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  h3 {
    font-size: 1rem;
    font-weight: 600;
    margin-top: 2rem;
    margin-bottom: 0.75rem;
  }

  p {
    margin-bottom: 0.75rem;
  }

  p:last-child {
    margin-bottom: 0;
  }

  /* Hero */
  .hero {
    text-align: center;
    padding: 3rem 2rem;
    margin-top: 2rem;
    position: relative;
    background: var(--hero-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .site-title {
    font-size: 0.875rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    margin-bottom: 1rem;
  }

  .ip-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }

  /* The IP is a big DISPLAY of your address (also editable to look up another).
     Kept borderless so it reads as a value, not a second button competing with
     the "Lookup" CTA — a faint underline hints it's editable, brightening on focus. */
  .ip-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.5rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ip-color);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    border-radius: 0;
    text-align: center;
    width: 75%;
    padding: 0.35rem 0.5rem;
    outline: none;
    transition: border-color 0.15s;
  }

  .ip-input:hover {
    border-bottom-color: var(--border);
  }

  .ip-input:focus {
    border-bottom-color: var(--accent);
  }

  .ip-button {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 0.4rem 1.25rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .ip-button:hover {
    opacity: 0.85;
    text-decoration: none;
  }

  .ip-buttons {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
  }

  .ip-button-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .ip-meta {
    margin-top: 0.75rem;
    font-size: 1.125rem;
    color: var(--text-secondary);
  }

  /* Sponsor logo */
  .sponsor-logo {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 86px;
    text-align: center;
    opacity: 0.8;
    transition: opacity 0.15s;
  }

  .sponsor-logo:hover {
    opacity: 1;
  }

  .sponsor-logo a {
    display: block;
  }

  .sponsor-logo svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .sponsor-logo span {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.65rem;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .sponsor-logo .letters {
    fill: var(--text);
  }

  .sponsor-logo img {
    display: block;
    width: 100%;
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(24, 56, 18, 0.22));
  }

  /* Details grid */
  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    align-items: start;
  }

  .details-grid.single-column {
    grid-template-columns: 1fr;
    max-width: 540px;
  }

  .info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .info-table th,
  .info-table td {
    padding: 0.35rem 0.75rem 0.35rem 0;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .info-table tr:last-child th,
  .info-table tr:last-child td {
    border-bottom: none;
  }

  .info-table tr:hover {
    background: var(--table-row-hover);
  }

  .info-table th {
    color: var(--text-secondary);
    font-weight: 500;
    white-space: nowrap;
    width: 40%;
  }

  .info-table td {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    word-break: break-all;
    color: var(--accent);
  }

  /* Map */
  .map-wrapper {
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .map-wrapper iframe {
    display: block;
    width: 100%;
    height: 300px;
    border: none;
  }

  .attribution {
    margin-top: 0.75rem;
    font-size: 0.8rem;
    color: var(--text-secondary);
  }

  /* API table */
  .api-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    font-size: 0.9rem;
  }

  .api-table th {
    text-align: left;
    padding: 0.35rem 0.75rem 0.35rem 0;
    border-bottom: 2px solid var(--border);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
  }

  .api-table td {
    padding: 0.35rem 0.75rem 0.35rem 0;
    border-bottom: 1px solid var(--border);
  }

  .api-table tr:last-child td {
    border-bottom: none;
  }

  .api-table + p,
  .api-table + .api-table {
    margin-top: 1.5rem;
  }

  .api-table tr:hover {
    background: var(--table-row-hover);
  }

  /* Note box */
  .note {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: var(--text);
  }

  .note ul {
    list-style: none;
    padding: 0;
  }

  .note li + li {
    margin-top: 0.75rem;
  }

  .note li::before {
    content: '\203A\00a0';
    color: var(--accent);
    font-weight: 600;
  }

  /* JSON block — terminal style */
  .json-block {
    background: var(--json-bg);
    color: var(--json-text);
    border: 1px solid var(--border);
    border-left: 3px solid var(--json-border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* FAQ */
  .faq-list dt {
    font-weight: 600;
    margin-top: 1.5rem;
  }

  .faq-list dt:first-child {
    margin-top: 0;
  }

  .faq-list dd {
    margin-top: 0.25rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  /* Footer */
  .footer {
    padding: 1.5rem 0;
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .footer a {
    color: var(--text-secondary);
    text-decoration: underline;
  }

  .footer a:hover {
    color: var(--text);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .details-grid {
      grid-template-columns: 1fr;
    }

    .ip-input {
      font-size: 1.5rem;
    }

    .hero {
      padding: 2rem 0;
    }

    .sponsor-logo {
      position: static;
      margin: 0 auto 1rem;
    }
  }
</style>
